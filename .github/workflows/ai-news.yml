name: AI News Bot

on:
  schedule:
    # UTC. Moscow = UTC+3
    - cron: "0,20,40 5-6 * * *"
    - cron: "0,20,40 10-11 * * *"
    - cron: "0,20,40 16-17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish now, ignore schedule
        type: boolean
        default: true
      dry_run:
        description: Only print post to log, do not publish
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: ai-news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: '-1004319183379'
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SEED_SALT: ${{ github.repository }}
          FORCE_RUN: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python bot.py

      - name: Commit history
        if: always()
        run: |
          git config user.name ai-news-bot
          git config user.email bot@users.noreply.github.com
          git add history.json
          git diff --staged --quiet || git commit -m "history: $(date -u +%F_%H:%M)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true
